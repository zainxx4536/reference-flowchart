name: Flowchart checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      FLOWCHART_FONT_PATH: output/ci-fonts/NotoSerifCJKsc-Regular.otf
      FLOWCHART_KEEP_TEST_OUTPUT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare checksum-pinned OFL font
        run: python tests/prepare_ci_font.py
      - name: Check environment
        run: npm run check:env
      - name: Run unit and browser regression tests
        run: npm test
      - name: Render all examples
        run: |
          npm run demo
          npm run example:paper
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: flowcharts-${{ matrix.os }}
          path: |
            output/**/*.png
            output/**/*.validation.json
          if-no-files-found: ignore
