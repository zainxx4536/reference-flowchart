<svg id="flowchart" data-layout-sha256="d3c97e04214526bc55f6a53cf0d25f063d3220c2a8d6c844909dbd5b6fd74661" xmlns="http://www.w3.org/2000/svg" width="2280" height="1470" viewBox="0 0 2280 1470" font-family="SimSun, &quot;Songti SC&quot;, &quot;Noto Serif CJK SC&quot;, serif" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">基于频谱瀑布图的抗干扰通信总流程</title><desc id="chart-desc">上方为发射、传播、干扰叠加和本轮通信结果；下方为选频控制及训练支路。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#111"/></marker></defs>
<style>text{fill:#111}.zone>rect{fill:none;stroke:#111;stroke-width:1.6;stroke-dasharray:10 6}.flow{fill:none;stroke:#111;stroke-linejoin:round;stroke-linecap:round}.box{fill:#fff;stroke:#111;stroke-width:1.8}.arc{fill:none;stroke:#111;stroke-width:1.5}.junction{fill:#111}</style>
<rect width="2280" height="1470" fill="#fff"/><text x="1140" y="46" font-size="37" font-weight="700" text-anchor="middle" >基于频谱瀑布图的抗干扰通信总流程</text><text x="1140" y="83" font-size="25" font-weight="400" text-anchor="middle" >从用户信号发射、受干扰传输到接收结果，再经选频控制开始下一轮通信</text><g class="zone" id="zone-tx" data-box="180,120,310,430"><rect x="180" y="120" width="310" height="430"/><text x="335" y="158" font-size="28" font-weight="700" text-anchor="middle" class="zone-title">业务信号发射</text></g><g class="zone" id="zone-air" data-box="530,120,560,430"><rect x="530" y="120" width="560" height="430"/><text x="810" y="158" font-size="28" font-weight="700" text-anchor="middle" class="zone-title">无线传播与干扰</text></g><g class="zone" id="zone-rx" data-box="1130,120,1110,430"><rect x="1130" y="120" width="1110" height="430"/><text x="1685" y="158" font-size="28" font-weight="700" text-anchor="middle" class="zone-title">接收端：接收、感知与结果反馈</text></g><g class="zone" id="zone-agent" data-box="40,620,2200,750"><rect x="40" y="620" width="2200" height="750"/><text x="1140" y="658" font-size="28" font-weight="700" text-anchor="middle" class="zone-title">接收端 Agent：运行 ADRLA（状态构建、选频控制与网络学习）</text></g><g class="zone" id="zone-rcnn" data-box="640,690,1060,245"><rect x="640" y="690" width="1060" height="245"/><text x="1170" y="727" font-size="28" font-weight="700" text-anchor="middle" class="zone-title">RCNN：候选频率的 Q 值估计</text></g><g class="zone" id="zone-learning" data-box="100,1020,1660,310"><rect x="100" y="1020" width="1660" height="310"/><text x="930" y="1063" font-size="27" font-weight="700" text-anchor="middle" class="zone-title">经验回放与网络学习（仅训练阶段且经验量充足时）</text></g><polyline class="flow" id="edge-user-input" points="150,345 220,345" data-from="user" data-to="transmitter" stroke-width="2.3" marker-end="url(#arrow)"/><polyline class="flow" id="edge-transmit" points="450,345 570,345" data-from="transmitter" data-to="channel" stroke-width="2.3" marker-end="url(#arrow)"/><polyline class="flow" id="edge-propagate" points="770,345 810,345" data-from="channel" data-to="superposition" stroke-width="2.3" marker-end="url(#arrow)"/><polyline class="flow" id="edge-jamming" points="927.5,250 927.5,290" data-from="jammer" data-to="superposition" stroke-width="2.3" marker-end="url(#arrow)"/><polyline class="flow" id="edge-mixed-input" points="1045,345 1160,345" data-from="superposition" data-to="receiver" stroke-width="2.3" marker-end="url(#arrow)"/><polyline class="flow" id="edge-assess" points="1410,345 1460,345" data-from="receiver" data-to="sinr" stroke-width="2.3" marker-end="url(#arrow)"/><polyline class="flow" id="edge-business-result" points="1790,345 1840,345" data-from="sinr" data-to="result" stroke-width="2.3" marker-end="url(#arrow)"/><polyline class="flow" id="edge-sense" points="1285,400 1285,445" data-from="receiver" data-to="sensing" stroke-width="2" marker-end="url(#arrow)"/><polyline class="flow" id="edge-reward" points="2010,400 2010,422 1975,422 1975,445" data-from="result" data-to="reward" stroke-width="2" marker-end="url(#arrow)"/><polyline class="flow" id="edge-new-state" points="1390,541 1390,580 1970,580 1970,750" data-from="sensing" data-to="state" stroke-width="2" marker-end="url(#arrow)"/><polyline class="flow" id="edge-state-to-pl" points="1760,812.5 1650,812.5" data-from="state" data-to="pl" stroke-width="2" marker-end="url(#arrow)"/><polyline class="flow" id="edge-pl-to-features" points="1380,812.5 1330,812.5" data-from="pl" data-to="rcl-rfcl" stroke-width="2" marker-end="url(#arrow)"/><polyline class="flow" id="edge-features-to-q" points="1035,812.5 980,812.5" data-from="rcl-rfcl" data-to="q" stroke-width="2" marker-end="url(#arrow)"/><polyline class="flow" id="edge-q-to-policy" points="690,812.5 570,812.5" data-from="q" data-to="policy" stroke-width="2" marker-end="url(#arrow)"/><polyline class="flow" id="edge-reliable-control" points="335,750 335,400" data-from="policy" data-to="transmitter" stroke-width="2" marker-end="url(#arrow)"/><polyline class="flow" id="edge-experience-fields" points="1970,875 1970,950 1980,950 1980,1030" data-from="state" data-to="experience-join" stroke-width="2" /><polyline class="flow" id="edge-reward-to-experience" points="2180,495 2220,495 2220,1030 1980,1030" data-from="reward" data-to="experience-join" stroke-width="2" /><polyline class="flow" id="edge-save-experience" points="1980,1030 1980,1100" data-from="experience-join" data-to="memory" stroke-width="2" marker-end="url(#arrow)"/><polyline class="flow" id="edge-replay" points="1800,1190 1740,1190" data-from="memory" data-to="sample" stroke-width="2" marker-end="url(#arrow)"/><polyline class="flow" id="edge-make-target" points="1400,1190 1340,1190" data-from="sample" data-to="target" stroke-width="2" marker-end="url(#arrow)"/><polyline class="flow" id="edge-make-loss" points="1000,1190 940,1190" data-from="target" data-to="gradient" stroke-width="2" marker-end="url(#arrow)"/><polyline class="flow" id="edge-update-weights" points="600,1190 540,1190" data-from="gradient" data-to="weights" stroke-width="2" marker-end="url(#arrow)"/><polyline class="flow" id="edge-weights-to-network" points="345,1115 345,978 1170,978 1170,935" data-from="weights" data-to="rcnn" stroke-width="2" marker-end="url(#arrow)"/><circle class="junction" id="junction-experience-join" cx="1980" cy="1030" r="5"/><g class="node" id="node-user" data-box="30,275,120,140" data-padding-y="35.0" data-shape="cylinder"><path class="box" d="M30,289.0 a60.0,14.0 0 0 1 120,0 v112.0 a60.0,14.0 0 0 1 -120,0 Z"/><path class="arc" d="M30,289.0 a60.0,14.0 0 0 0 120,0"/><text x="90" y="336.75" font-size="25" font-weight="700" text-anchor="middle" >待发送</text><text x="90" y="370.25" font-size="25" font-weight="400" text-anchor="middle" >用户信号</text></g><g class="node" id="node-transmitter" data-box="220,290,230,110" data-padding-y="7" data-shape="rect"><rect class="box" x="220" y="290" width="230" height="110"/><text x="335" y="320" font-size="25" font-weight="700" text-anchor="middle" >发射端</text><text x="335" y="353.5" font-size="25" font-weight="400" text-anchor="middle" >按本轮中心频率</text><text x="335" y="387" font-size="25" font-weight="400" text-anchor="middle" >发送用户信号</text></g><g class="node" id="node-channel" data-box="570,290,200,110" data-padding-y="7" data-shape="rect"><rect class="box" x="570" y="290" width="200" height="110"/><text x="670" y="336.75" font-size="25" font-weight="700" text-anchor="middle" >无线信道</text><text x="670" y="370.25" font-size="25" font-weight="400" text-anchor="middle" >有用信号传播</text></g><g class="node" id="node-jammer" data-box="810,170,235,80" data-padding-y="7" data-shape="rect"><rect class="box" x="810" y="170" width="235" height="80"/><text x="927.5" y="201.75" font-size="25" font-weight="700" text-anchor="middle" >干扰源</text><text x="927.5" y="235.25" font-size="25" font-weight="400" text-anchor="middle" >动态／智能干扰</text></g><g class="node" id="node-superposition" data-box="810,290,235,110" data-padding-y="7" data-shape="rect"><rect class="box" x="810" y="290" width="235" height="110"/><text x="927.5" y="320" font-size="25" font-weight="700" text-anchor="middle" >信号叠加（式2）</text><text x="927.5" y="353.5" font-size="25" font-weight="400" text-anchor="middle" >用户信号＋干扰</text><text x="927.5" y="387" font-size="25" font-weight="400" text-anchor="middle" >＋环境噪声</text></g><g class="node" id="node-receiver" data-box="1160,290,250,110" data-padding-y="7" data-shape="rect"><rect class="box" x="1160" y="290" width="250" height="110"/><text x="1285" y="320" font-size="25" font-weight="700" text-anchor="middle" >接收机</text><text x="1285" y="353.5" font-size="25" font-weight="400" text-anchor="middle" >接收混合信号</text><text x="1285" y="387" font-size="25" font-weight="400" text-anchor="middle" >分支感知与通信评估</text></g><g class="node" id="node-sinr" data-box="1460,290,330,110" data-padding-y="7" data-shape="rect"><rect class="box" x="1460" y="290" width="330" height="110"/><text x="1625" y="320" font-size="25" font-weight="700" text-anchor="middle" >评估通信是否成功</text><text x="1625" y="353.5" font-size="25" font-weight="400" text-anchor="middle" >本轮 SINR 与门限比较</text><text x="1625" y="387" font-size="25" font-weight="400" text-anchor="middle" >（式1）</text></g><g class="node" id="node-result" data-box="1840,290,340,110" data-padding-y="7" data-shape="rect"><rect class="box" x="1840" y="290" width="340" height="110"/><text x="2010" y="320" font-size="25" font-weight="700" text-anchor="middle" >本次通信结果</text><text x="2010" y="353.5" font-size="25" font-weight="400" text-anchor="middle" >接收成功／失败</text><text x="2010" y="387" font-size="25" font-weight="400" text-anchor="middle" >本轮业务链路输出</text></g><g class="node" id="node-sensing" data-box="1160,445,460,96" data-padding-y="7" data-shape="rect"><rect class="box" x="1160" y="445" width="460" height="96"/><text x="1390" y="484.75" font-size="25" font-weight="700" text-anchor="middle" >持续感知整个通信频带</text><text x="1390" y="518.25" font-size="25" font-weight="400" text-anchor="middle" >新频谱观测 s<tspan baseline-shift="sub" font-size="17.5">t+1</tspan>（式2）</text></g><g class="node" id="node-reward" data-box="1770,445,410,100" data-padding-y="7" data-shape="rect"><rect class="box" x="1770" y="445" width="410" height="100"/><text x="1975" y="483.5" font-size="25" font-weight="700" text-anchor="middle" >Agent 计算奖励 r<tspan baseline-shift="sub" font-size="17.5">t</tspan>（式3）</text><text x="1975" y="523.5" font-size="25" font-weight="400" text-anchor="middle" >通信成功收益 − 换频成本</text></g><g class="node" id="node-state" data-box="1760,750,420,125" data-padding-y="7" data-shape="rect"><rect class="box" x="1760" y="750" width="420" height="125"/><text x="1970" y="787.5" font-size="25" font-weight="700" text-anchor="middle" >构建频谱瀑布图</text><text x="1970" y="821" font-size="25" font-weight="400" text-anchor="middle" >更新为下一状态 S<tspan baseline-shift="sub" font-size="17.5">t+1</tspan></text><text x="1970" y="854.5" font-size="25" font-weight="400" text-anchor="middle" >新观测＋保留的历史频谱</text></g><g class="node" id="node-pl" data-box="1380,750,270,125" data-padding-y="7" data-shape="rect"><rect class="box" x="1380" y="750" width="270" height="125"/><text x="1515" y="787.5" font-size="25" font-weight="700" text-anchor="middle" >PL 预处理</text><text x="1515" y="821" font-size="25" font-weight="400" text-anchor="middle" >阈值过滤噪声</text><text x="1515" y="854.5" font-size="25" font-weight="400" text-anchor="middle" >（式5）</text></g><g class="node" id="node-rcl-rfcl" data-box="1035,750,295,125" data-padding-y="7" data-shape="rect"><rect class="box" x="1035" y="750" width="295" height="125"/><text x="1182.5" y="787.5" font-size="25" font-weight="700" text-anchor="middle" >RCL／RFCL</text><text x="1182.5" y="821" font-size="25" font-weight="400" text-anchor="middle" >时频特征与递归复用</text><text x="1182.5" y="854.5" font-size="25" font-weight="400" text-anchor="middle" >（式6、7）</text></g><g class="node" id="node-q" data-box="690,750,290,125" data-padding-y="7" data-shape="rect"><rect class="box" x="690" y="750" width="290" height="125"/><text x="835" y="787.5" font-size="25" font-weight="700" text-anchor="middle" >候选频率 Q 值</text><text x="835" y="821" font-size="25" font-weight="400" text-anchor="middle" >估计折扣长期回报</text><text x="835" y="854.5" font-size="25" font-weight="400" text-anchor="middle" >（式4）</text></g><g class="node" id="node-policy" data-box="100,750,470,125" data-padding-y="7" data-shape="rect"><rect class="box" x="100" y="750" width="470" height="125"/><text x="335" y="787.5" font-size="25" font-weight="700" text-anchor="middle" >ADRLA：选择下一轮频率</text><text x="335" y="821" font-size="25" font-weight="400" text-anchor="middle" >训练：ε-贪心，保留探索</text><text x="335" y="854.5" font-size="25" font-weight="400" text-anchor="middle" >推理：选最大 Q 对应频率</text></g><g class="node" id="node-memory" data-box="1800,1100,360,180" data-padding-y="35.0" data-shape="cylinder"><path class="box" d="M1800,1114.0 a180.0,14.0 0 0 1 360,0 v152.0 a180.0,14.0 0 0 1 -360,0 Z"/><path class="arc" d="M1800,1114.0 a180.0,14.0 0 0 0 360,0"/><text x="1980" y="1165" font-size="25" font-weight="700" text-anchor="middle" >经验池 D</text><text x="1980" y="1198.5" font-size="25" font-weight="400" text-anchor="middle" >保存每轮完整交互</text><text x="1980" y="1232" font-size="25" font-weight="400" text-anchor="middle" >(S<tspan baseline-shift="sub" font-size="17.5">t</tspan>, a<tspan baseline-shift="sub" font-size="17.5">t</tspan>, r<tspan baseline-shift="sub" font-size="17.5">t</tspan>, s<tspan baseline-shift="sub" font-size="17.5">t+1</tspan>)</text></g><g class="node" id="node-sample" data-box="1400,1115,340,150" data-padding-y="7" data-shape="rect"><rect class="box" x="1400" y="1115" width="340" height="150"/><text x="1570" y="1165" font-size="25" font-weight="700" text-anchor="middle" >经验回放</text><text x="1570" y="1198.5" font-size="25" font-weight="400" text-anchor="middle" >均匀随机抽取小批量</text><text x="1570" y="1232" font-size="25" font-weight="400" text-anchor="middle" >结合历史重建下一状态</text></g><g class="node" id="node-target" data-box="1000,1115,340,150" data-padding-y="7" data-shape="rect"><rect class="box" x="1000" y="1115" width="340" height="150"/><text x="1170" y="1165" font-size="25" font-weight="700" text-anchor="middle" >构造学习目标</text><text x="1170" y="1198.5" font-size="25" font-weight="400" text-anchor="middle" >奖励与下一状态最大 Q</text><text x="1170" y="1232" font-size="25" font-weight="400" text-anchor="middle" >（图3）</text></g><g class="node" id="node-gradient" data-box="600,1115,340,150" data-padding-y="7" data-shape="rect"><rect class="box" x="600" y="1115" width="340" height="150"/><text x="770" y="1165" font-size="25" font-weight="700" text-anchor="middle" >重新计算样本 Q</text><text x="770" y="1198.5" font-size="25" font-weight="400" text-anchor="middle" >与目标比较并求损失梯度</text><text x="770" y="1232" font-size="25" font-weight="400" text-anchor="middle" >（式8）</text></g><g class="node" id="node-weights" data-box="150,1115,390,150" data-padding-y="7" data-shape="rect"><rect class="box" x="150" y="1115" width="390" height="150"/><text x="345" y="1165" font-size="25" font-weight="700" text-anchor="middle" >更新 RCNN 参数</text><text x="345" y="1198.5" font-size="25" font-weight="400" text-anchor="middle" >梯度下降，迭代学习</text><text x="345" y="1232" font-size="25" font-weight="400" text-anchor="middle" >（式8）</text></g><text x="335" y="211" font-size="21" font-weight="400" text-anchor="middle" >本轮频率来自初始化选频</text><text x="335" y="242" font-size="21" font-weight="400" text-anchor="middle" >或上一轮 Agent 决策</text><text x="943" y="276" font-size="21" font-weight="400" text-anchor="start" >干扰信号</text><text x="350" y="475" font-size="22" font-weight="400" text-anchor="start" >可靠控制链路</text><text x="350" y="507" font-size="22" font-weight="400" text-anchor="start" >下轮频率 a<tspan baseline-shift="sub" font-size="15.4">t+1</tspan></text><text x="1680" y="567" font-size="23" font-weight="400" text-anchor="middle" >全频带新观测</text><text x="335" y="910" font-size="23" font-weight="400" text-anchor="middle" >动作 a<tspan baseline-shift="sub" font-size="16.1">t+1</tspan>：下一次通信中心频率</text><text x="1170" y="916" font-size="23" font-weight="400" text-anchor="middle" >训练时关闭递归；固定参数后启用递归计算。</text><text x="1740" y="980" font-size="22" font-weight="400" text-anchor="end" >新观测＋本轮已缓存的 S<tspan baseline-shift="sub" font-size="15.4">t</tspan>、a<tspan baseline-shift="sub" font-size="15.4">t</tspan></text><text x="2162" y="1015" font-size="22" font-weight="400" text-anchor="middle" >奖励 r<tspan baseline-shift="sub" font-size="15.4">t</tspan></text><text x="2010" y="1072" font-size="24" font-weight="400" text-anchor="start" >每轮保存完整交互</text><text x="770" y="1007" font-size="23" font-weight="400" text-anchor="middle" >更新权重 θ，供后续 Q 值估计使用</text><text x="930" y="1304" font-size="23" font-weight="400" text-anchor="middle" >训练满足条件时先更新参数，再进行下一轮选频；达到迭代上限后固定参数。</text><text x="1140" y="1355" font-size="24" font-weight="400" text-anchor="middle" >启动：初始状态全零、网络参数随机、经验池为空；通信与选频按闭环持续运行。</text><text x="60" y="1410" font-size="23" font-weight="400" text-anchor="start" >时序：本轮用 a<tspan baseline-shift="sub" font-size="16.1">t</tspan> 发送；接收反馈更新 S<tspan baseline-shift="sub" font-size="16.1">t+1</tspan>、选择 a<tspan baseline-shift="sub" font-size="16.1">t+1</tspan>，经控制链路返回发射端，开始下一轮通信。</text><text x="60" y="1449" font-size="23" font-weight="400" text-anchor="start" >经验中的 s<tspan baseline-shift="sub" font-size="16.1">t+1</tspan> 是新一条频谱观测，回放时结合历史重建完整下一状态；论文用 SINR 门限定义通信成功。</text></svg>